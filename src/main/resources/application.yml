spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: jdbc:h2:mem:techdoc;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true

# 로컬 LLM 서버 (모델·서빙 도구 확정 후 수정)
llm:
  provider: fake   # fake | ollama
  base-url: http://localhost:11434
  model: TBD       # ollama 사용 시 예: qwen2.5:3b
  timeout-seconds: 300
  summary-chunk-chars: 4000

app:
  upload-dir: uploads
  auth:
    enabled: false   # true면 로그인(JWT)이 필요하다. 프론트에 로그인 화면이 생기면 켠다
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}   # 실제 사용 시 환경 변수로 바꾼다
    token-hours: 24
    google-client-id: ${GOOGLE_CLIENT_ID:142317490993-hj3283vukns16ku0rmno1ruimmimff1n.apps.googleusercontent.com}   # 공개되어도 되는 값(비밀키 아님)
    kakao-app-id: ${KAKAO_APP_ID:1666834}   # 카카오 앱 ID(대시보드에 표시되는 번호). 비밀키 아님
