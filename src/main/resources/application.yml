spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: jdbc:h2:mem:techdoc;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true

# 로컬 LLM 서버 (모델·서빙 도구 확정 후 수정)
llm:
  provider: fake   # fake | ollama
  base-url: http://localhost:11434
  model: TBD       # ollama 사용 시 예: qwen2.5:3b
  timeout-seconds: 300
  summary-chunk-chars: 4000

app:
  upload-dir: uploads
