# PostgreSQL 사용: 프로필 postgres 지정 (예: SPRING_PROFILES_ACTIVE=local,postgres)
# 접속 정보는 환경 변수로 넣는다. 비밀번호를 파일에 적지 않는다.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/techdoc}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update   # 서버를 다시 켜도 데이터가 남는다. 테이블이 없으면 만든다
  h2:
    console:
      enabled: false
